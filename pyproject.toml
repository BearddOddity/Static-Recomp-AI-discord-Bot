[project]
name = "static-recomp-ai-discord-bot"
version = "0.1.0-alpha"
description = "Discord assistant and moderator for the static recompilation community"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "B", "UP"]
# zip() lengths are equal by construction; Optional/Union style is left to taste.
ignore = ["B905", "UP007", "E501"]
